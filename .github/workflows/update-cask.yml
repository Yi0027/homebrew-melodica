name: Update Homebrew Cask

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Update cask version and SHA256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: Yi0027/Melodica
          CASK_PATH: Casks/melodica.rb
        run: |
          set -euo pipefail

          echo "Fetching latest release from $REPO..."
          RELEASE_JSON=$(curl -sSL -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases")

          # Первый не-draft релиз
          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.[] | select(.draft == false) | .tag_name' | head -n1)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No valid release found"
            exit 1
          fi

          VERSION="${LATEST_TAG#v}"
          echo "Latest version: $VERSION"

          # Имена файлов согласно скрипту export_releases.sh
          ARM_ASSET="Melodica-${VERSION}-AppleSilicon-arm64.dmg"
          INTEL_ASSET="Melodica-${VERSION}-Intel-x86_64.dmg"

          ARM_URL="https://github.com/$REPO/releases/download/$LATEST_TAG/$ARM_ASSET"
          INTEL_URL="https://github.com/$REPO/releases/download/$LATEST_TAG/$INTEL_ASSET"

          echo "Downloading $ARM_ASSET..."
          curl -fsSL "$ARM_URL" -o /tmp/arm.dmg
          SHA256_ARM=$(shasum -a 256 /tmp/arm.dmg | awk '{print $1}')
          echo "ARM SHA256: $SHA256_ARM"

          echo "Downloading $INTEL_ASSET..."
          curl -fsSL "$INTEL_URL" -o /tmp/intel.dmg
          SHA256_INTEL=$(shasum -a 256 /tmp/intel.dmg | awk '{print $1}')
          echo "Intel SHA256: $SHA256_INTEL"

          echo "Rewriting cask file: $CASK_PATH"
          cat <<EOF > "$CASK_PATH"
          cask "melodica" do
            arch arm: "AppleSilicon-arm64", intel: "Intel-x86_64"

            version "$VERSION"
            sha256 arm:   "$SHA256_ARM",
                   intel: "$SHA256_INTEL"

            url "https://github.com/$REPO/releases/download/v#{version}/Melodica-#{version}-#{arch}.dmg"
            name "Melodica"
            desc "Audio player for macOS with two themes and advanced LRC support"
            homepage "https://github.com/$REPO"

            livecheck do
              url :url
              strategy :github_releases do |json, regex|
                json.map do |release|
                  next if release["draft"]
                  next if release["prerelease"] && !version.to_s.include?("-pre")
                  match = release["tag_name"]&.match(regex)
                  next unless match
                  match[1]
                end
              end
            end

            app "Melodica.app"

            postflight_steps do
              run "/usr/bin/xattr", args: ["-cr", "{{appdir}}/Melodica.app"], must_succeed: false
            end
          end
          EOF

          # Убираем пробелы от отступа в EOF
          sed -i '' -E 's/^[ ]{10}//' "$CASK_PATH"

          echo "Updated cask content:"
          cat "$CASK_PATH"

          if git diff --quiet "$CASK_PATH"; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$CASK_PATH"
            git commit -m "Auto-update Melodica to $VERSION"
            git push origin main
          fi
